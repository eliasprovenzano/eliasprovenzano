<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elias Provenzano | Portafolio Musical</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-color: #f8fafc;
            --text-secondary: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        nav ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        nav a {
            color: var(--text-color);
            text-decoration: none;
            transition: color 0.3s;
        }

        nav a:hover {
            color: var(--accent-color);
        }

        main {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero {
            text-align: center;
            padding: 4rem 0;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        .hero p {
            color: var(--text-secondary);
            font-size: 1.2rem;
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        /* Player Section */
        .player-section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 3rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
        }

        @media (max-width: 768px) {
            .player-section {
                grid-template-columns: 1fr;
            }
        }

        .now-playing {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .album-art {
            width: 250px;
            height: 250px;
            border-radius: 8px;
            object-fit: cover;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
        }

        .track-info h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .track-info p {
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .btn-control {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-control:hover {
            color: var(--accent-color);
        }

        .btn-play {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--accent-color);
            color: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .btn-play:hover {
            transform: scale(1.05);
            color: var(--bg-color);
        }

        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .progress-bar {
            flex-grow: 1;
            height: 6px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            cursor: pointer;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-color);
            border-radius: 3px;
            width: 0%;
        }

        .time {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        /* Playlist */
        .playlist-container h3 {
            margin-bottom: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 0.5rem;
        }

        .playlist {
            list-style: none;
            max-height: 350px;
            overflow-y: auto;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .track-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
        }

        .track-item.active {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
        }

        .track-details {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .track-details img {
            width: 40px;
            height: 40px;
            border-radius: 4px;
            object-fit: cover;
        }

        .track-title-container {
            display: flex;
            flex-direction: column;
        }

        .track-title {
            font-weight: 600;
        }

        .track-artist {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        footer {
            text-align: center;
            padding: 2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-secondary);
            margin-top: 4rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Elias Provenzano</div>
        <nav>
            <ul>
                <li><a href="#inicio">Inicio</a></li>
                <li><a href="#musica">Música</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" id="inicio">
            <h1>Explora mi Música</h1>
            <p>Portafolio oficial de proyectos y canciones.</p>
        </section>

        <section class="player-section" id="musica">
            <div class="now-playing">
                <div id="artWrapper">
                    <img src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=400&q=80" alt="Album Cover" class="album-art" id="currentCover">
                </div>
                <div class="track-info">
                    <h3 id="currentTitle">Selecciona una canción</h3>
                    <p id="currentArtist">Elias Provenzano</p>
                </div>
                <div class="controls">
                    <button class="btn-control" id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
                    <button class="btn-control btn-play" id="playBtn"><i class="fa-solid fa-play"></i></button>
                    <button class="btn-control" id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
                </div>
                <div class="progress-container">
                    <span class="time" id="currentTime">0:00</span>
                    <div class="progress-bar" id="progressBar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <span class="time" id="durationTime">0:00</span>
                </div>
            </div>

            <div class="playlist-container">
                <h3>Lista de Reproducción</h3>
                <ul class="playlist" id="playlist">
                    <!-- Tracks rendered dynamically -->
                </ul>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Elias Provenzano. Todos los derechos reservados.</p>
    </footer>

    <audio id="audioPlayer"></audio>

    <script>
        // Default Tracks
        const defaultTracks = [
            {
                id: 1,
                title: "looper blues",
                artist: "Elias Provenzano",
                album: "Sencillo 2026",
                duration: "--:--",
                cover: "portada1.jpg",
                src: "looper blues.mp3"
            },
            {
                id: 2,
                title: "epilogo",
                artist: "Elias Provenzano",
                album: "Sencillo 2026",
                duration: "--:--",
                cover: "portada2.jpg",
                src: "epilogo.mp3"
            },
            {
                id: 3,
                title: "exorcismo",
                artist: "Elias Provenzano",
                album: "Sencillo 2026",
                duration: "--:--",
                cover: "portada3.jpg",
                src: "exorcismo.mp3"
            },
            {
                id: 4,
                title: "gen de la locura",
                artist: "Elias Provenzano",
                album: "Sencillo 2026",
                duration: "--:--",
                cover: "portada4.jpg",
                src: "gen de la locura.mp3"
            },
            {
                id: 5,
                title: "acaros en tu bosca",
                artist: "Elias Provenzano",
                album: "Sencillo 2026",
                duration: "--:--",
                cover: "portada5.jpg",
                src: "acaros en tu boca.mp3"
            },
            {
                id: 6,
                title: "go on",
                artist: "Elias Provenzano",
                album: "Sencillo 2026",
                duration: "--:--",
                cover: "portada6.jpg",
                src: "go on.mp3"
            }
        ];

        let playlist = JSON.parse(localStorage.getItem('elias_playlist_v4')) || defaultTracks;
        let currentTrackIndex = 0;
        let isPlaying = false;

        const audio = document.getElementById('audioPlayer');
        const playBtn = document.getElementById('playBtn');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const playlistContainer = document.getElementById('playlist');
        const progressBar = document.getElementById('progressBar');
        const progressFill = document.getElementById('progressFill');
        const currentTimeEl = document.getElementById('currentTime');
        const durationTimeEl = document.getElementById('durationTime');

        function renderPlaylist() {
            playlistContainer.innerHTML = '';
            playlist.forEach((track, index) => {
                const trackEl = document.createElement('li');
                trackEl.className = `track-item ${index === currentTrackIndex ? 'active' : ''}`;
                trackEl.innerHTML = `
                    <div class="track-details">
                        <img src="${track.cover}" alt="${track.title}" onerror="this.src='https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=400&q=80'">
                        <div class="track-title-container">
                            <span class="track-title">${track.title}</span>
                            <span class="track-artist">${track.artist}</span>
                        </div>
                    </div>
                    <span class="time">${track.duration}</span>
                `;
                trackEl.addEventListener('click', () => loadTrack(index, true));
                playlistContainer.appendChild(trackEl);
            });
        }

        function loadTrack(index, autoPlay = false) {
            currentTrackIndex = index;
            const track = playlist[currentTrackIndex];
            
            document.getElementById('currentTitle').textContent = track.title;
            document.getElementById('currentArtist').textContent = track.artist;
            
            const coverImg = document.getElementById('currentCover');
            coverImg.src = track.cover;
            coverImg.onerror = function() {
                this.src = 'https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?auto=format&fit=crop&w=400&q=80';
            };

            audio.src = track.src;
            
            renderPlaylist();

            if (autoPlay) {
                playTrack();
            }
        }

        function playTrack() {
            isPlaying = true;
            audio.play();
            playBtn.innerHTML = '<i class="fa-solid fa-pause"></i>';
        }

        function pauseTrack() {
            isPlaying = false;
            audio.pause();
            playBtn.innerHTML = '<i class="fa-solid fa-play"></i>';
        }

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                pauseTrack();
            } else {
                playTrack();
            }
        });

        prevBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex - 1 + playlist.length) % playlist.length;
            loadTrack(currentTrackIndex, isPlaying);
        });

        nextBtn.addEventListener('click', () => {
            currentTrackIndex = (currentTrackIndex + 1) % playlist.length;
            loadTrack(currentTrackIndex, isPlaying);
        });

        audio.addEventListener('timeupdate', () => {
            if (audio.duration) {
                const progressPercent = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = `${progressPercent}%`;
                
                currentTimeEl.textContent = formatTime(audio.currentTime);
                durationTimeEl.textContent = formatTime(audio.duration);
            }
        });

        audio.addEventListener('ended', () => {
            nextBtn.click();
        });

        progressBar.addEventListener('click', (e) => {
            const width = progressBar.clientWidth;
            const clickX = e.offsetX;
            const duration = audio.duration;
            audio.currentTime = (clickX / width) * duration;
        });

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Save v4 structure to clear cache
        localStorage.setItem('elias_playlist_v4', JSON.stringify(defaultTracks));

        // Initial Load
        loadTrack(0);
    </script>
</body>
</html>
